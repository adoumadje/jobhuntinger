spring:
  application:
    name: jobhuntinger

  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:jobhuntingerdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: 'create-drop'
  liquibase:
    enabled: false

  config:
    import:
      - "application-liquibase.yaml"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "https://accounts.google.com"

logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

client:
  url: "http://localhost:4200"