<main class="dashboard">
    <h2 class="dashboard__title">Applied Jobs</h2>

    <!-- Filters -->
    <form #filterForm="ngForm" class="dashboard__filters" (ngSubmit)="onApplyFilters(filterForm)">
        <div class="dashboard__search">
            <input
                class="dashboard__search-input"
                type="text"
                placeholder="Enter company or job title"
                name="keyword" ngModel>
        </div>

        <div class="dashboard__date-filter">
            <label class="dashboard__date-label" for="to-date">
                Up to date
            </label>

            <input
                class="dashboard__date-input"
                id="to-date"
                type="date"
                name="toDate" ngModel>
        </div>

        <div class="dashboard__rows">
            <label class="dashboard__rows-label" for="rows">
                Rows
            </label>

            <select
                class="dashboard__rows-select"
                name="rows"
                id="rows"
                name="rows" ngModel>
                <option [ngValue]="5" selected>5</option>
                <option [ngValue]="10">10</option>
            </select>
        </div>

        <button
            type="submit"
            class="dashboard__submit-btn">
            Apply Filters
        </button>
    </form>
    
    @if (jobPage(); as jp) {
        <!-- Table -->
        <div class="dashboard__table-container">
            <table class="dashboard__table">
                <thead class="dashboard__table-head">
                    <tr>
                        <th>Date</th>
                        <th>Company</th>
                        <th>Job Title</th>
                        <th>Resume</th>
                        <th>Details</th>
                    </tr>
                </thead>

                <tbody class="dashboard__table-body">
                    @for(job of jp.content; track $index) {
                        <tr class="dashboard__row">
                            <td class="dashboard__date">
                                {{ job.dateDisplay }}<br>
                                <span>{{ job.timeDisplay }}</span>
                            </td>

                            <td>
                                <div class="dashboard__company">
                                    <img
                                        class="dashboard__company-logo"
                                        [src]="job.companyLogoUrl"
                                        alt="Company logo">

                                    <span class="dashboard__company-name">
                                        {{ job.companyName }}
                                    </span>
                                </div>
                            </td>

                            <td class="dashboard__job-title">
                                {{ job.jobTitle }}
                            </td>

                            <td>
                                <a class="dashboard__resume-link" [href]="job.resumeUrl" target="_blank">
                                    {{ job.resumeName }}
                                </a>
                            </td>

                            <td>
                                <a class="dashboard__details-link" 
                                [routerLink]="`/main/job-details/${job.jobPublicId}`">
                                    More details
                                </a>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>

        <!-- Pager -->
        <app-pager [currentPage]="jp.number"
                    [totalPages]="jp.totalPages"
                    (pageChange)="onPageChange($event)" />
    }
</main>
