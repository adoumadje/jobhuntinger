spring:
  application:
    name: jobhuntinger

  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:jobhuntingerdb
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: 'create-drop'
  liquibase:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "https://www.googleapis.com/oauth2/v1/certs"

logging:
  level:
    org.springframework.security: trace