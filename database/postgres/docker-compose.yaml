services:
  postgres:
    image: "postgres:16"
    container_name: jobhuntinger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobhuntingerdb
      POSTGRES_USER: jhUser
      POSTGRES_PASSWORD: jhPass
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgres" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data